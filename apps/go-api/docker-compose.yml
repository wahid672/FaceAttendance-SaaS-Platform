services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: faceattendance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-face_attendance}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
      - ./migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
      - ./migrations/000002_seed_initial_user.up.sql:/docker-entrypoint-initdb.d/02_seed_initial_user.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-face_attendance}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - go-network

  go-api:
    container_name: faceattendance-go-api
    build:
      context: .
      dockerfile: Dockerfile
    image: faceattendance-go-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-face_attendance}?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-replace-in-production}
      AI_ENGINE_URL: ${AI_ENGINE_URL:-http://faceattendance-ai-engine:5000}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.65}
    networks:
      - go-network
      - caddy_net

volumes:
  pgvector_data:
    name: faceattendance_pgvector_data

networks:
  go-network:
    name: faceattendance_go_net
    driver: bridge
  caddy_net:
    external: true
