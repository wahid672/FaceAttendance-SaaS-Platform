services:
  ai-engine:
    container_name: faceattendance-ai-engine
    build:
      context: .
      dockerfile: Dockerfile
    image: faceattendance-ai-engine:latest
    restart: unless-stopped
    ports:
      - "${AI_ENGINE_PORT:-5000}:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      # Persistensi cache model InsightFace (buffalo_l) agar tidak download ulang saat restart container
      - insightface_models:/root/.insightface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - ai-network

volumes:
  insightface_models:
    name: faceattendance_insightface_models

networks:
  ai-network:
    name: faceattendance_ai_net
    driver: bridge
